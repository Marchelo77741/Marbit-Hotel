[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Sitios públicos por dominio: netlify/edge-functions/sitio.ts (se declara dentro del propio archivo).
[functions]
  node_bundler = "esbuild"

# La app es una SPA: cualquier ruta que no sea un archivo abre index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
